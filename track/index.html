
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>埋点实时调试 · ALLENYUKIN</title>
<style>
    :root {
        --accent: #ff9f43;
        --accent-soft: rgba(255, 159, 67, 0.14);
        --violet: #a78bfa;
        --bg: #0f1417;
        --panel: rgba(255, 255, 255, 0.04);
        --panel-2: rgba(255, 255, 255, 0.07);
        --border: rgba(255, 255, 255, 0.1);
        --border-strong: rgba(255, 255, 255, 0.18);
        --text: #eceef0;
        --muted: #8b949e;
        --good: #34d399;
        --bad: #f87171;
        --mono: "SF Mono", "Fira Code", Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scrollbar-width: thin; scrollbar-color: rgba(255,159,67,.35) transparent; }
    body {
        background:
            radial-gradient(800px 400px at 85% -10%, rgba(255, 159, 67, 0.07), transparent 60%),
            radial-gradient(700px 380px at -10% 20%, rgba(126, 184, 154, 0.06), transparent 60%),
            var(--bg);
        color: var(--text);
        font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
        min-height: 100vh;
        padding: 76px 20px 44px;
        -webkit-font-smoothing: antialiased;
    }

    /* ===== 顶栏 ===== */
    header {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 22px;
        background: rgba(15, 20, 23, 0.82);
        -webkit-backdrop-filter: blur(18px) saturate(1.3);
        backdrop-filter: blur(18px) saturate(1.3);
        border-bottom: 1px solid var(--border);
        z-index: 20;
    }
    header a.home {
        display: flex; align-items: center; gap: 8px;
        color: var(--text); text-decoration: none;
        font-weight: 700; letter-spacing: 1.5px; font-size: 0.82rem;
    }
    header a.home .logo-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
        animation: logo-pulse 3s ease-in-out infinite;
    }
    @keyframes logo-pulse { 50% { box-shadow: 0 0 4px var(--accent); } }
    header .divider { width: 1px; height: 18px; background: var(--border-strong); }
    header .title { font-size: 0.85rem; color: var(--muted); letter-spacing: 1px; }

    .conn {
        margin-left: auto;
        display: flex; align-items: center; gap: 8px;
        font-size: 0.74rem; color: var(--muted);
        padding: 5px 14px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel);
        transition: border-color 0.3s;
    }
    .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; transition: all 0.3s; }
    .conn.online { border-color: rgba(52, 211, 153, 0.4); color: var(--good); }
    .conn.online .dot { background: var(--good); box-shadow: 0 0 8px var(--good); }
    .conn.connecting { border-color: rgba(255, 159, 67, 0.4); color: var(--accent); }
    .conn.connecting .dot { background: var(--accent); animation: blink 1s infinite; }
    .conn.offline { border-color: rgba(248, 113, 113, 0.4); color: var(--bad); }
    .conn.offline .dot { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
    @keyframes blink { 50% { opacity: 0.3; } }

    /* ===== 布局 ===== */
    .layout {
        display: flex;
        gap: 20px;
        max-width: 1320px;
        margin: 0 auto;
        align-items: flex-start;
    }
    .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        overflow: hidden;
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }
    .events { flex: 1; min-width: 0; }
    .sidebar { width: 312px; flex-shrink: 0; }

    .panel-head {
        display: flex; align-items: center; gap: 10px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        font-size: 0.78rem; font-weight: 700; letter-spacing: 2px;
    }
    .panel-head .head-icon {
        width: 26px; height: 26px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.72rem;
    }
    .panel-head .count {
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--accent);
        background: var(--accent-soft);
        padding: 2px 9px;
        border-radius: 99px;
        min-width: 26px;
        text-align: center;
        transition: transform 0.2s;
    }
    .panel-head .count.bump { transform: scale(1.3); }
    .panel-head .spacer { flex: 1; }

    .btn {
        display: inline-flex; align-items: center; gap: 5px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--muted);
        border-radius: 9px;
        padding: 6px 13px;
        font-size: 0.73rem;
        cursor: pointer;
        transition: all 0.22s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .btn:hover {
        color: var(--accent);
        border-color: rgba(255, 159, 67, 0.55);
        background: var(--accent-soft);
        transform: translateY(-1px);
    }
    .btn:active { transform: scale(0.95); }
    .btn.warn:hover {
        color: var(--bad);
        border-color: rgba(248, 113, 113, 0.55);
        background: rgba(248, 113, 113, 0.1);
    }

    .search-wrap { position: relative; flex: 1; min-width: 110px; }
    .search-wrap i {
        position: absolute; left: 11px; top: 50%;
        transform: translateY(-50%);
        color: var(--muted); font-size: 0.68rem;
        pointer-events: none;
        transition: color 0.2s;
    }
    .search-wrap input {
        width: 100%;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 9px;
        color: var(--text);
        padding: 6px 12px 6px 30px;
        font-size: 0.76rem;
        outline: none;
        transition: border-color 0.25s, box-shadow 0.25s;
    }
    .search-wrap input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(255, 159, 67, 0.12);
    }
    .search-wrap:focus-within i { color: var(--accent); }

    /* ===== 选中设备横幅 ===== */
    .device-banner {
        display: none;
        align-items: center;
        gap: 9px;
        padding: 9px 18px;
        background: linear-gradient(90deg, rgba(255, 159, 67, 0.14), transparent 75%);
        border-bottom: 1px solid var(--border);
        font-size: 0.76rem;
        animation: banner-in 0.4s ease;
    }
    .device-banner.show { display: flex; }
    @keyframes banner-in { from { opacity: 0; transform: translateY(-6px); } }
    .device-banner .b-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--good);
        box-shadow: 0 0 8px var(--good);
        animation: blink 2s infinite;
    }
    .device-banner b { color: var(--accent); font-weight: 700; }
    .device-banner .hint { color: var(--muted); font-size: 0.7rem; margin-left: 4px; }
    .device-banner .unset {
        margin-left: auto;
        border: none; background: none; color: var(--muted);
        cursor: pointer; font-size: 0.72rem;
        padding: 3px 8px; border-radius: 7px;
        transition: all 0.2s;
    }
    .device-banner .unset:hover { color: var(--bad); background: rgba(248, 113, 113, 0.1); }

    /* ===== 事件流 ===== */
    #event-list {
        max-height: max(280px, calc(100vh - 230px));
        overflow-y: auto;
        padding: 12px;
        display: flex; flex-direction: column; gap: 10px;
    }
    #event-list::-webkit-scrollbar { width: 8px; }
    #event-list::-webkit-scrollbar-thumb { background: rgba(255, 159, 67, 0.3); border-radius: 8px; }
    #event-list > .ev { flex-shrink: 0; } /* 防止条目过多时被 flex 压扁 */

    .ev {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 16px;
        cursor: pointer;
        transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
        animation: ev-in 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
        position: relative;
        overflow: hidden;
    }
    @keyframes ev-in {
        from { opacity: 0; transform: translateY(-14px) scale(0.97); filter: blur(3px); }
        to { opacity: 1; transform: none; filter: blur(0); }
    }
    .ev::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: var(--accent);
        opacity: 0.85;
    }
    .ev.pv::before { background: var(--violet); }
    .ev:hover {
        border-color: rgba(255, 159, 67, 0.4);
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
    }
    .ev .row1 { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .ev .tag {
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 1px;
        padding: 2px 8px;
        border-radius: 6px;
        line-height: 1.5;
        flex-shrink: 0;
    }
    .ev .tag.custom { background: var(--accent-soft); color: var(--accent); }
    .ev .tag.pv-tag { background: rgba(167, 139, 250, 0.15); color: var(--violet); }
    .ev .name {
        font-family: var(--mono);
        font-weight: 600;
        font-size: 0.82rem;
        color: var(--text);
        word-break: break-all;
    }
    .ev .page {
        font-size: 0.7rem;
        color: var(--muted);
        padding: 2px 9px;
        background: var(--panel);
        border-radius: 6px;
    }
    .ev .time {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 0.68rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
    }
    .ev pre {
        margin-top: 10px;
        font-family: var(--mono);
        font-size: 0.7rem;
        line-height: 1.7;
        color: var(--muted);
        background: rgba(0, 0, 0, 0.24);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 260px;
        overflow-y: auto;
        display: none;
        animation: pre-in 0.3s ease;
    }
    @keyframes pre-in { from { opacity: 0; transform: translateY(-4px); } }
    .ev.open pre { display: block; }
    .ev .expand-hint {
        font-size: 0.64rem;
        color: var(--muted);
        margin-top: 7px;
        display: flex;
        align-items: center;
        gap: 5px;
        opacity: 0.7;
        transition: opacity 0.2s, color 0.2s;
    }
    .ev:hover .expand-hint { opacity: 1; color: var(--accent); }
    .ev.open .expand-hint { display: none; }

    /* 清场动画 */
    #event-list.clearing .ev { animation: ev-out 0.3s ease forwards; }
    @keyframes ev-out { to { opacity: 0; transform: translateY(-12px) scale(0.96); } }

    .empty {
        text-align: center;
        color: var(--muted);
        padding: 56px 0;
        animation: empty-in 0.5s ease;
    }
    @keyframes empty-in { from { opacity: 0; } }
    .empty i {
        font-size: 1.7rem;
        opacity: 0.45;
        margin-bottom: 14px;
        display: block;
        animation: float 3s ease-in-out infinite;
    }
    @keyframes float { 50% { transform: translateY(-6px); } }
    .empty .t1 { font-size: 0.82rem; margin-bottom: 5px; color: var(--text); opacity: 0.75; }
    .empty .t2 { font-size: 0.7rem; }

    /* ===== 设备列表 ===== */
    #device-list {
        padding: 12px;
        display: flex; flex-direction: column; gap: 10px;
        max-height: max(280px, calc(100vh - 230px));
        overflow-y: auto;
    }
    .dev-card {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 15px;
        padding: 12px 14px;
        cursor: pointer;
        transition: all 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    #device-list > .dev-card { flex-shrink: 0; }
    .dev-card:hover {
        border-color: rgba(255, 159, 67, 0.45);
        transform: translateX(-3px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }
    .dev-card .avatar {
        width: 38px; height: 38px;
        border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700;
        font-size: 0.9rem;
        flex-shrink: 0;
        background: linear-gradient(135deg, rgba(255, 159, 67, 0.25), rgba(255, 159, 67, 0.08));
        color: var(--accent);
        border: 1px solid rgba(255, 159, 67, 0.3);
        transition: all 0.3s;
    }
    .dev-card.wolfbox .avatar {
        background: linear-gradient(135deg, rgba(167, 139, 250, 0.25), rgba(167, 139, 250, 0.08));
        color: var(--violet);
        border-color: rgba(167, 139, 250, 0.3);
    }
    .dev-card .body { flex: 1; min-width: 0; }
    .dev-card .dname { overflow-wrap: anywhere; }
    .dev-card .dname {
        font-weight: 700;
        font-size: 0.8rem;
        display: flex; align-items: center; gap: 7px;
        flex-wrap: wrap;
    }
    .dev-card .app-chip {
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        padding: 1px 7px;
        border-radius: 5px;
        background: var(--accent-soft);
        color: var(--accent);
    }
    .dev-card.wolfbox .app-chip {
        background: rgba(167, 139, 250, 0.15);
        color: var(--violet);
    }
    .dev-card .dmeta {
        font-size: 0.66rem;
        color: var(--muted);
        margin-top: 4px;
        line-height: 1.65;
        font-family: var(--mono);
    }
    .dev-card .dmeta b { color: var(--accent); font-weight: 600; }
    .dev-card .sel-check {
        width: 20px; height: 20px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.55rem;
        border: 1.5px solid var(--border-strong);
        color: transparent;
        flex-shrink: 0;
        transition: all 0.25s;
    }
    .dev-card.active {
        border-color: var(--accent);
        background: linear-gradient(90deg, rgba(255, 159, 67, 0.12), var(--panel-2) 60%);
        box-shadow: 0 0 20px -4px rgba(255, 159, 67, 0.35);
        transform: translateX(-3px);
    }
    .dev-card.active .sel-check {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        animation: check-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes check-pop { from { transform: scale(0); } }

    .dev-empty { text-align: center; color: var(--muted); padding: 44px 0; }
    .dev-empty i { font-size: 1.5rem; opacity: 0.4; display: block; margin-bottom: 12px; animation: float 3s ease-in-out infinite; }
    .dev-empty .t1 { font-size: 0.78rem; color: var(--text); opacity: 0.7; margin-bottom: 4px; }
    .dev-empty .t2 { font-size: 0.68rem; }

    /* ===== 回归校验面板 ===== */
    .check-panel { margin-top: 20px; }
    .check-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
    .check-textarea {
        width: 100%;
        min-height: 110px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        padding: 12px 14px;
        font-family: var(--mono);
        font-size: 0.74rem;
        line-height: 1.7;
        outline: none;
        resize: vertical;
        transition: border-color 0.25s;
    }
    .check-textarea:focus { border-color: var(--accent); }
    .check-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .check-toolbar .file-label {
        display: inline-flex; align-items: center; gap: 5px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--muted);
        border-radius: 9px;
        padding: 6px 13px;
        font-size: 0.73rem;
        cursor: pointer;
        transition: all 0.22s;
    }
    .check-toolbar .file-label:hover { color: var(--accent); border-color: rgba(255,159,67,0.55); }
    .check-toolbar input[type="file"] { display: none; }
    .btn.primary {
        color: #14191c;
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 700;
    }
    .btn.primary:hover { background: #ffb066; color: #14191c; transform: translateY(-1px); }
    .btn.primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
    }
    .check-progress {
        display: none;
        align-items: center;
        gap: 10px;
        font-size: 0.78rem;
        padding: 10px 14px;
        border: 1px solid rgba(255,159,67,0.4);
        border-radius: 12px;
        background: rgba(255,159,67,0.08);
    }
    .check-progress.show { display: flex; }
    .check-progress .bar {
        flex: 1;
        height: 6px;
        border-radius: 6px;
        background: var(--panel-2);
        overflow: hidden;
    }
    .check-progress .bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--accent), #ffd8a8);
        border-radius: 6px;
        transition: width 0.4s ease;
    }
    .expected-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
    .expected-item {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        padding: 8px 12px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 0.74rem;
        animation: dev-in 0.4s ease;
    }
    .expected-item input { margin-top: 3px; accent-color: var(--accent); }
    .expected-item .ename { font-family: var(--mono); font-weight: 600; word-break: break-all; }
    .expected-item .eparams { color: var(--muted); font-family: var(--mono); font-size: 0.68rem; word-break: break-all; }
    .result-table { width: 100%; border-collapse: collapse; font-size: 0.74rem; }
    .result-table th, .result-table td {
        text-align: left;
        padding: 9px 12px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
    }
    .result-table th { color: var(--muted); font-size: 0.68rem; letter-spacing: 1px; }
    .result-table td.name { font-family: var(--mono); word-break: break-all; }
    .result-table .st { font-weight: 700; white-space: nowrap; }
    .result-table .st.ok { color: var(--good); }
    .result-table .st.miss { color: var(--bad); }
    .result-table .st.param { color: var(--accent); }
    .result-table .detail { color: var(--muted); font-family: var(--mono); font-size: 0.68rem; word-break: break-all; }
    .result-summary { font-size: 0.78rem; line-height: 1.9; }
    .result-summary b.ok { color: var(--good); }
    .result-summary b.miss { color: var(--bad); }
    .result-summary b.param { color: var(--accent); }

    @media (max-width: 900px) {
        .layout { flex-direction: column; }
        .sidebar { width: 100%; }
        #event-list, #device-list { max-height: 46vh; }
    }
</style>
</head>
<body>
<header>
    <a class="home" href="/"><span class="logo-dot"></span>ALLENYUKIN</a>
    <span class="divider"></span>
    <span class="title">埋点实时调试台</span>
    <div class="conn connecting" id="conn"><span class="dot"></span><span id="conn-text">连接中…</span></div>
</header>

<div class="layout">
    <section class="panel events">
        <div class="panel-head">
            <span class="head-icon"><i class="fa-solid fa-bolt"></i></span>事件流
            <span class="count" id="ev-count">0</span>
            <div class="search-wrap">
                <input class="search" id="q" placeholder="搜索点位 / 页面 / 参数…" />
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <button class="btn warn" id="clear-ev"><i class="fa-solid fa-eraser"></i>清空</button>
            <button class="btn" id="sim"><i class="fa-solid fa-wand-magic-sparkles"></i>模拟</button>
        </div>
        <div class="device-banner" id="device-banner">
            <span class="b-dot"></span>
            正在接收 <b id="banner-name">-</b> 的点位
            <span class="hint">其他设备不进流</span>
            <button class="unset" id="unset-device"><i class="fa-solid fa-xmark"></i> 取消选择</button>
        </div>
        <div id="event-list"></div>
    </section>

    <aside class="panel sidebar">
        <div class="panel-head">
            <span class="head-icon"><i class="fa-solid fa-mobile-screen"></i></span>设备
            <span class="count" id="dev-count">0</span>
            <span class="spacer"></span>
            <button class="btn warn" id="clear-dev"><i class="fa-solid fa-eraser"></i>清空</button>
            <button class="btn" id="rescan"><i class="fa-solid fa-rotate"></i>扫描</button>
        </div>
        <div id="device-list"></div>
    </aside>
</div>

<section class="panel check-panel">
    <div class="panel-head">
        <span class="head-icon"><i class="fa-solid fa-list-check"></i></span>回归校验
        <span class="count" id="chk-count">0</span>
        <span class="spacer"></span>
        <button class="btn" id="chk-copy" style="display:none"><i class="fa-solid fa-copy"></i>复制报告</button>
    </div>
    <div class="check-body">
        <div class="check-toolbar">
            <label class="file-label"><i class="fa-solid fa-file-arrow-up"></i>上传 .md
                <input type="file" id="chk-file" accept=".md,.markdown,.txt" />
            </label>
            <button class="btn" id="chk-parse"><i class="fa-solid fa-wand-magic-sparkles"></i>解析</button>
            <button class="btn warn" id="chk-clear"><i class="fa-solid fa-eraser"></i>清空</button>
            <span class="spacer" style="flex:1"></span>
            <button class="btn primary" id="chk-start"><i class="fa-solid fa-play"></i>开始回归校验</button>
            <button class="btn warn" id="chk-stop" style="display:none"><i class="fa-solid fa-stop"></i>结束校验</button>
        </div>
        <textarea class="check-textarea" id="chk-input" placeholder="粘贴或上传埋点文档内容，支持：
1) 表格行：| home_page_view | id, type |
2) 列表：- home_page_view(id, type)
3) 行文本：home_page_view 参数：id、type
解析后可在下方勾选剔除误识别项。"></textarea>
        <div class="expected-list" id="chk-list"></div>
        <div class="check-progress" id="chk-progress">
            <i class="fa-solid fa-tower-broadcast" style="color:var(--accent)"></i>
            <span id="chk-progress-text">0 / 0</span>
            <div class="bar"><i id="chk-bar"></i></div>
            <span style="font-size:0.68rem;color:var(--muted)">全部命中自动结束，也可手动结束</span>
        </div>
        <div id="chk-result"></div>
    </div>
</section>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
(function () {
    var TOPIC_EVENT = "alleyny/track/event";
    var TOPIC_DEVICE = "alleyny/track/device";
    var events = [];
    var devices = {};
    var filterText = "";
    var filterDevice = null;

    var connEl = document.getElementById("conn");
    var connText = document.getElementById("conn-text");
    var listEl = document.getElementById("event-list");
    var devEl = document.getElementById("device-list");
    var q = document.getElementById("q");
    var banner = document.getElementById("device-banner");
    var bannerName = document.getElementById("banner-name");
    var evCount = document.getElementById("ev-count");
    var devCount = document.getElementById("dev-count");

    function setConn(state, text) {
        connEl.className = "conn " + state;
        connText.textContent = text;
    }

    /* ===== MQTT 连接（三 broker 自动切换） ===== */
    var client = null;
    var BROKERS = [
        { url: "wss://broker.emqx.io:8084/mqtt", name: "emqx" },
        { url: "wss://broker.hivemq.com:8884/mqtt", name: "hivemq" },
        { url: "wss://test.mosquitto.org:8081", name: "mosquitto" },
    ];
    var brokerIdx = 0;
    var switchTimer = null;
    function connect() {
        clearTimeout(switchTimer);
        setConn("connecting", "连接中…");
        try { if (client) client.end(true); } catch (e) {}
        client = mqtt.connect(BROKERS[brokerIdx % BROKERS.length].url, {
            clientId: "track-console-" + Math.random().toString(16).slice(2, 8),
            connectTimeout: 8000,
            reconnectPeriod: 0,
        });
        client.on("connect", function () {
            clearTimeout(switchTimer);
            client.subscribe([TOPIC_EVENT, TOPIC_DEVICE], function () {});
            setConn("online", "已连接 · " + BROKERS[brokerIdx % BROKERS.length].name);
        });
        client.on("message", function (topic, payload) {
            try {
                var data = JSON.parse(payload.toString());
                if (topic === TOPIC_DEVICE) {
                    upsertDevice(data);
                } else {
                    addEvent(data);
                }
            } catch (e) {}
        });
        client.on("reconnect", function () { setConn("connecting", "重连中…"); });
        client.on("close", function () {
            if (connEl.className.indexOf("online") === -1) {
                brokerIdx++;
                switchTimer = setTimeout(connect, 600);
            } else setConn("offline", "已断开");
        });
        client.on("error", function () { try { client.end(true); } catch (e) {} });
        switchTimer = setTimeout(function () {
            if (connEl.className.indexOf("online") === -1) {
                brokerIdx++;
                try { client.end(true); } catch (e) {}
                connect();
            }
        }, 8000);
    }

    function fmtTime(ts) {
        var d = ts ? new Date(ts) : new Date();
        function p(n) { return (n < 10 ? "0" : "") + n; }
        return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    }
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }
    function bumpCount(el) {
        el.classList.remove("bump");
        void el.offsetWidth;
        el.classList.add("bump");
        setTimeout(function () { el.classList.remove("bump"); }, 220);
    }

    /* ===== 事件：仅选中设备后进流 ===== */
    function addEvent(data) {
        var evName = data.event || "unknown";
        var isCustom = evName.indexOf("$") !== 0;
        var isMappedPv = /_page_view$/.test(evName);
        if (!isCustom && !isMappedPv) return; // 只收自定义埋点与映射 PV
        var accepted = filterDevice !== null && data.deviceId === filterDevice;
        if (data.deviceId && !devices[data.deviceId]) {
            // 事件自带设备信息，未收到上线消息也能补建设备
            devices[data.deviceId] = {
                device: data.device || data.deviceId,
                app: (data.app || "").toLowerCase(),
                ip: "",
                version: "",
                count: 0,
                last: Date.now(),
            };
            renderDevices();
        }
        if (data.deviceId && devices[data.deviceId]) {
            devices[data.deviceId].last = Date.now();
            if (!accepted) renderDevices();
        }
        if (!accepted) return;

        events.unshift({
            name: data.event || "unknown",
            page: data.page || "",
            deviceId: data.deviceId || "",
            ts: data.ts || Date.now(),
            params: data.params || {},
        });
        if (events.length > 300) events.length = 300;
        if (devices[data.deviceId]) devices[data.deviceId].count++;
        if (window.__chkHook) { try { window.__chkHook(events[0]); } catch (e) {} }
        bumpCount(evCount);
        renderDevices();
        prependEventCard(events[0]);
    }

    function upsertDevice(data) {
        var id = data.deviceId || data.device || "unknown";
        devices[id] = {
            device: data.device || id,
            app: (data.app || "").toLowerCase(),
            ip: data.ip || "",
            version: data.version || "",
            count: (devices[id] && devices[id].count) || 0,
            last: Date.now(),
        };
        renderDevices();
    }

    function matchFilter(ev) {
        if (!filterText) return true;
        var s = filterText.toLowerCase();
        return (ev.name + " " + ev.page + " " + JSON.stringify(ev.params)).toLowerCase().indexOf(s) !== -1;
    }

    function buildEventCard(ev) {
        var isPv = /_page_view$/.test(ev.name);
        var paramsStr = "";
        try { paramsStr = JSON.stringify(ev.params, null, 2); } catch (e) {}
        var hasParams = paramsStr && paramsStr !== "{}";
        var div = document.createElement("div");
        div.className = "ev" + (isPv ? " pv" : "");
        div.innerHTML =
            '<div class="row1">' +
            '<span class="tag ' + (isPv ? 'pv-tag">PV' : 'custom">自定义') + "</span>" +
            '<span class="name">' + escapeHtml(ev.name) + "</span>" +
            (ev.page ? '<span class="page">' + escapeHtml(ev.page) + "</span>" : "") +
            '<span class="time">' + fmtTime(ev.ts) + "</span>" +
            "</div>" +
            (hasParams
                ? '<div class="expand-hint"><i class="fa-solid fa-chevron-down"></i>点击展开参数</div><pre>' + escapeHtml(paramsStr) + "</pre>"
                : "");
        div.onclick = function () { div.classList.toggle("open"); };
        return div;
    }

    function prependEventCard(ev) {
        if (filterText && !matchFilter(ev)) return;
        var emptyEl = listEl.querySelector(".empty");
        if (emptyEl) emptyEl.remove();
        listEl.prepend(buildEventCard(ev));
        while (listEl.children.length > 100) listEl.removeChild(listEl.lastChild);
        evCount.textContent = events.length;
    }

    function renderEvents() {
        evCount.textContent = events.length;
        var shown = events.filter(matchFilter);
        if (!shown.length) {
            listEl.innerHTML =
                '<div class="empty">' +
                (events.length
                    ? '<i class="fa-solid fa-magnifying-glass"></i><div class="t1">无匹配结果</div><div class="t2">换个关键词试试</div>'
                    : '<i class="fa-solid fa-tower-broadcast"></i><div class="t1">' +
                      (filterDevice ? "已选中设备，等待该设备的点位…" : "请先在右侧选择设备") +
                      '</div><div class="t2">选中后实时接收该设备的埋点</div>') +
                "</div>";
            return;
        }
        listEl.innerHTML = "";
        shown.slice(0, 100).forEach(function (ev) {
            listEl.appendChild(buildEventCard(ev));
        });
    }

    function renderDevices() {
        var ids = Object.keys(devices);
        devCount.textContent = ids.length;
        if (!ids.length) {
            devEl.innerHTML =
                '<div class="dev-empty"><i class="fa-solid fa-mobile-screen-button"></i>' +
                '<div class="t1">暂无设备</div><div class="t2">App（Debug 包）启动后自动出现</div></div>';
            return;
        }
        devEl.innerHTML = "";
        ids.forEach(function (id) {
            var d = devices[id];
            var card = document.createElement("div");
            card.className = "dev-card" +
                (d.app === "wolfbox" ? " wolfbox" : "") +
                (filterDevice === id ? " active" : "");
            var initial = (d.device || "?").replace(/[^A-Za-z0-9\u4e00-\u9fa5]/g, "").slice(0, 1) || "?";
            card.innerHTML =
                '<div class="avatar">' + escapeHtml(initial) + "</div>" +
                '<div class="body">' +
                '<div class="dname">' + escapeHtml(d.device) +
                (d.app ? ' <span class="app-chip">' + escapeHtml(d.app.toUpperCase()) + "</span>" : "") +
                "</div>" +
                '<div class="dmeta">' +
                (d.version ? "v" + escapeHtml(d.version) + " · " : "") +
                (d.ip ? escapeHtml(d.ip) + " · " : "") +
                "事件 <b>" + d.count + "</b> · 活跃 " + fmtTime(d.last) +
                "</div></div>" +
                '<div class="sel-check"><i class="fa-solid fa-check"></i></div>';
            card.onclick = function () {
                if (filterDevice === id) return;
                selectDevice(id);
            };
            devEl.appendChild(card);
        });
    }

    /* ===== 选中设备：清空流 + 横幅 ===== */
    function clearStreamAnimated(cb) {
        var cards = listEl.querySelectorAll(".ev");
        if (!cards.length) { cb(); return; }
        listEl.classList.add("clearing");
        setTimeout(function () {
            listEl.classList.remove("clearing");
            cb();
        }, 280);
    }

    function selectDevice(id) {
        clearStreamAnimated(function () {
            filterDevice = id;
            events = [];
            q.value = "";
            filterText = "";
            var d = devices[id];
            banner.classList.add("show");
            bannerName.textContent = d ? d.device : id;
            renderEvents();
            renderDevices();
        });
    }

    function unsetDevice() {
        clearStreamAnimated(function () {
            filterDevice = null;
            events = [];
            q.value = "";
            filterText = "";
            banner.classList.remove("show");
            renderEvents();
            renderDevices();
        });
    }

    /* ===== 交互绑定 ===== */
    q.addEventListener("input", function () { filterText = q.value.trim(); renderEvents(); });
    document.getElementById("clear-ev").onclick = function () {
        clearStreamAnimated(function () { events = []; renderEvents(); });
    };
    document.getElementById("clear-dev").onclick = function () {
        devices = {};
        if (filterDevice) unsetDevice();
        else renderDevices();
    };
    document.getElementById("rescan").onclick = function () {
        devices = {};
        renderDevices();
        if (filterDevice) unsetDevice();
        connect();
    };
    document.getElementById("unset-device").onclick = unsetDevice;

    document.getElementById("sim").onclick = function () {
        upsertDevice({ deviceId: "SIM-0001", device: "模拟 iPhone", app: "redtiger", ip: "192.168.1.66", version: "5.3.0" });
        if (filterDevice !== "SIM-0001") {
            selectDevice("SIM-0001");
            setTimeout(fireSim, 340);
        } else fireSim();
        function fireSim() {
            var names = ["home_banner_click", "video_mp4_playback_access", "post_detail_view", "share_click", "home_page_view"];
            var pages = ["首页", "预览页", "详情页", "我的"];
            addEvent({
                event: names[Math.floor(Math.random() * names.length)],
                page: pages[Math.floor(Math.random() * pages.length)],
                deviceId: "SIM-0001",
                ts: Date.now(),
                params: { simulated: true, rid: Math.floor(Math.random() * 999), bitrate: Math.floor(Math.random() * 8e8) },
            });
        }
    };


    /* ===================== 回归校验 ===================== */
    var chkInput = document.getElementById("chk-input");
    var chkList = document.getElementById("chk-list");
    var chkCount = document.getElementById("chk-count");
    var chkStart = document.getElementById("chk-start");
    var chkStop = document.getElementById("chk-stop");
    var chkProgress = document.getElementById("chk-progress");
    var chkProgressText = document.getElementById("chk-progress-text");
    var chkBar = document.getElementById("chk-bar");
    var chkResult = document.getElementById("chk-result");
    var chkCopy = document.getElementById("chk-copy");
    var expected = [];        // [{name, params:[], checked}]
    var chk = { running: false, items: [], startedAt: 0, endReason: "" };

    var TOKEN_RE = /^[a-z][a-z0-9_]*[a-z0-9]$/i;
    var SKIP_TOKENS = { string: 1, number: 1, bool: 1, boolean: 1, true: 1, false: 1, ios: 1, android: 1, app: 1, id: 1, name: 1, type: 1 };

    function parseTrackDoc(text) {
        var map = {};
        var order = [];
        var CELL_TOKEN = /^([A-Za-z][A-Za-z0-9_]*[A-Za-z0-9])(?:\([^)]*\))?[:：]?$/; // 整格变量形态（允许括号参数/尾冒号）
        var lines = text.split(/\r?\n/);
        lines.forEach(function (line) {
            if (!line.trim()) return;
            if (line.indexOf("事件编号") !== -1 && line.indexOf("事件英文变量名") !== -1) return;

            // 剥离前导空白/表格线/项目符号，并统计前导 tab 深度
            var lead = line.match(/^[\t ]*(?:\|[	 |]*)?(?:[-*•][ ]+)?/)[0];
            var leadTabs = (lead.match(/\t/g) || []).length;
            var leadPipes = (lead.match(/\|/g) || []).length;
            var cells = line
                .slice(lead.length)
                .split(/\t+|\|+/)
                .map(function (c) { return c.trim(); });

            // 提取整格变量 token（idx 保留）
            var tokens = [];
            cells.forEach(function (c, idx) {
                var m = c.match(CELL_TOKEN);
                if (m) tokens.push({ raw: m[1], cell: c, idx: idx });
            });

            // 属性行：前导 tab>=2（完整表格缩进属性行），或 pipe 表格前导含 >=2 个竖线空档
            if ((leadTabs >= 2 || leadPipes >= 2) && order.length) {
                tokens.forEach(function (tk) {
                    if (!SKIP_TOKENS[tk.raw.toLowerCase()] && tk.raw.indexOf("$") !== 0) {
                        map[order[order.length - 1]].params[tk.raw] = true;
                    }
                });
                return;
            }

            // 事件行：第一个合法整格 token = 事件名
            var ev = null;
            for (var i = 0; i < tokens.length; i++) {
                var t = tokens[i].raw;
                if (!SKIP_TOKENS[t.toLowerCase()]) { ev = tokens[i]; ev.name = t; break; }
            }
            if (!ev) return;
            if (!map[ev.name]) { map[ev.name] = { name: ev.name, params: {} }; order.push(ev.name); }
            var target = map[ev.name];

            // 括号参数：home_page_view(id, type)
            var paren = ev.cell.match(/\(([^)]*)\)/);
            if (paren) {
                paren[1].split(/[,，、;；]+/).forEach(function (pk) {
                    pk = pk.trim().split(/[=＝:：]/)[0].trim();
                    if (pk && pk.indexOf("$") !== 0) target.params[pk] = true;
                });
            }
            // 同行第 5 列起（idx>=4，无折叠）的整格 token = 行内首个属性
            tokens.forEach(function (tk) {
                if (tk !== ev && tk.idx >= 4 && !SKIP_TOKENS[tk.raw.toLowerCase()] && tk.raw.indexOf("$") !== 0) {
                    target.params[tk.raw] = true;
                }
            });
        });
        return order.map(function (n) {
            return { name: n, params: Object.keys(map[n].params) };
        });
    }

    function renderExpected() {
        chkCount.textContent = expected.length;
        if (!expected.length) {
            chkList.innerHTML = '<div class="empty" style="padding:18px 0"><i class="fa-solid fa-file-lines" style="font-size:1rem"></i><div class="t1">解析后这里显示点位清单</div></div>';
            return;
        }
        chkList.innerHTML = "";
        expected.forEach(function (it) {
            var div = document.createElement("label");
            div.className = "expected-item";
            div.innerHTML =
                '<input type="checkbox" checked data-name="' + escapeHtml(it.name) + '" />' +
                '<span><span class="ename">' + escapeHtml(it.name) + "</span>" +
                (it.params.length ? '<div class="eparams">参数：' + escapeHtml(it.params.join("、")) + "</div>" : '<div class="eparams">无参数</div>') +
                "</span>";
            chkList.appendChild(div);
        });
    }

    function checkedExpected() {
        var boxes = chkList.querySelectorAll("input[type=checkbox]");
        var picked = {};
        boxes.forEach && boxes.forEach(function (b) { if (b.checked) picked[b.dataset.name] = true; });
        if (!boxes.forEach) for (var i = 0; i < boxes.length; i++) if (boxes[i].checked) picked[boxes[i].dataset.name] = true;
        return expected.filter(function (it) { return picked[it.name]; });
    }

    function startCheck() {
        var list = checkedExpected();
        if (!list.length) { alert("请先粘贴/上传并解析出点位"); return; }
        if (!filterDevice) { alert("请先在右侧选择设备"); return; }
        chk.running = true;
        chk.startedAt = Date.now();
        chk.endReason = "";
        chk.items = list.map(function (it) {
            return { name: it.name, params: it.params, status: "pending", firstTs: 0, missing: [], received: [] };
        });
        chkStart.disabled = true;
        chkStop.style.display = "";
        chkProgress.classList.add("show");
        chkResult.innerHTML = "";
        chkCopy.style.display = "none";
        updateChkProgress();
    }

    function updateChkProgress() {
        var done = chk.items.filter(function (i) { return i.status !== "pending"; }).length;
        var ok = chk.items.filter(function (i) { return i.status === "ok"; }).length;
        chkProgressText.textContent = ok + " / " + chk.items.length + " 命中";
        chkBar.style.width = (chk.items.length ? (done / chk.items.length) * 100 : 0) + "%";
    }

    function chkMatch(ev) {
        if (!chk.running) return;
        chk.items.forEach(function (item) {
            if (item.status !== "pending" || item.name !== ev.name) return;
            item.firstTs = item.firstTs || ev.ts;
            var recv = ev.params || {};
            var recvKeys = Object.keys(recv);
            item.received = recvKeys;
            if (!item.params.length) {
                item.status = "ok";
            } else {
                item.missing = item.params.filter(function (k) { return !(k in recv); });
                item.status = item.missing.length ? "param" : "ok";
            }
        });
        updateChkProgress();
        var allDone = chk.items.every(function (i) { return i.status !== "pending"; });
        if (allDone) finishCheck("自动结束：全部点位已上报");
    }

    function finishCheck(reason) {
        if (!chk.running) return;
        chk.running = false;
        chk.endReason = reason;
        chkStart.disabled = false;
        chkStop.style.display = "none";
        chkProgress.classList.remove("show");
        renderChkResult();
        chkCopy.style.display = "";
    }

    function renderChkResult() {
        var ok = 0, miss = 0, param = 0;
        var rows = chk.items.map(function (it) {
            var stTxt, stCls, detail;
            if (it.status === "ok") { ok++; stTxt = "✓ 已上报"; stCls = "ok"; detail = it.params.length ? "参数齐全：" + it.params.join("、") : "无参数要求"; }
            else if (it.status === "param") { param++; stTxt = "⚠ 参数不符"; stCls = "param"; detail = "缺失参数：" + it.missing.join("、") + "；实收：" + (it.received.join("、") || "无"); }
            else { miss++; stTxt = "✗ 未上报"; stCls = "miss"; detail = "校验期间未收到该点位"; }
            return { it: it, stTxt: stTxt, stCls: stCls, detail: detail };
        });
        var html = '<div class="result-summary">校验结果（' + escapeHtml(chk.endReason || "手动结束") + "）：" +
            "<b class='ok'>" + ok + " 正确</b> · <b class='param'>" + param + " 参数不符</b> · <b class='miss'>" + miss + " 缺失</b></div>";
        html += '<table class="result-table"><tr><th>点位</th><th>状态</th><th>核对明细</th><th>首报时间</th></tr>';
        rows.forEach(function (r) {
            html += '<tr><td class="name">' + escapeHtml(r.it.name) + "</td>" +
                '<td class="st ' + r.stCls + '">' + r.stTxt + "</td>" +
                '<td class="detail">' + escapeHtml(r.detail) + "</td>" +
                '<td class="detail">' + (r.it.firstTs ? fmtTime(r.it.firstTs) : "-") + "</td></tr>";
        });
        html += "</table>";
        chkResult.innerHTML = html;
    }

    function buildReport() {
        var lines = ["# 埋点回归校验报告", "", "- 设备：" + (filterDevice && devices[filterDevice] ? devices[filterDevice].device : filterDevice || "-"), "- 结束方式：" + (chk.endReason || "手动结束"), ""];
        chk.items.forEach(function (it) {
            var mark = it.status === "ok" ? "✅" : it.status === "param" ? "⚠️" : "❌";
            lines.push("- " + mark + " **" + it.name + "**");
            if (it.status === "param") lines.push("  - 缺失参数：" + it.missing.join("、") + "；实收：" + (it.received.join("、") || "无"));
            if (it.status === "pending") lines.push("  - 校验期间未上报");
        });
        return lines.join("\n");
    }

    document.getElementById("chk-parse").onclick = function () {
        expected = parseTrackDoc(chkInput.value);
        renderExpected();
        if (!expected.length) alert("未解析出点位，请检查内容格式");
    };
    document.getElementById("chk-clear").onclick = function () {
        if (chk.running) finishCheck("手动中止");
        chkInput.value = "";
        expected = [];
        renderExpected();
        chkResult.innerHTML = "";
        chkCopy.style.display = "none";
    };
    document.getElementById("chk-file").onchange = function (e) {
        var f = e.target.files && e.target.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () {
            chkInput.value = reader.result;
            expected = parseTrackDoc(chkInput.value);
            renderExpected();
        };
        reader.readAsText(f);
        e.target.value = "";
    };
    chkStart.onclick = startCheck;
    chkStop.onclick = function () { finishCheck("手动结束"); };
    chkCopy.onclick = function () {
        var text = buildReport();
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { chkCopy.innerHTML = '<i class="fa-solid fa-check"></i>已复制'; setTimeout(function () { chkCopy.innerHTML = '<i class="fa-solid fa-copy"></i>复制报告'; }, 1500); });
        else alert(text);
    };
    // 事件接入点：addEvent 内部调用
    window.__chkHook = chkMatch;
    renderExpected();

    renderEvents();
    renderDevices();
    connect();
})();
</script>
</body>
</html>
